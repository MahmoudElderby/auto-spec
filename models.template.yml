# Phase -> model routing + pipeline options for Auto Spec.
# After editing: /speckit-auto-spec-sync-models

schema_version: "2"
execution: task

pipeline:
  mode: full
  include_checklist: true
  max_converge_iterations: 5
  skip_constitution_if_present: true
  review_checklist_gate: false

phases:
  constitution: opus-4.7
  specify: opus-4.7
  clarify: opus-4.7
  plan: composer
  checklist: composer
  tasks: composer
  analyze: composer
  implement: composer
  converge: composer
  taskstoissues: inherit

aliases:
  inherit: inherit
  default: inherit
  auto: inherit
  opus: claude-opus-4-7-thinking-xhigh
  opus-4.7: claude-opus-4-7-thinking-xhigh
  "opus-4.7-xhigh": claude-opus-4-7-thinking-xhigh
  opus-5: claude-opus-5-thinking-high
  sonnet: claude-sonnet-5-thinking-high
  sonnet-5: claude-sonnet-5-thinking-high
  composer: composer-2.5-fast
  composer-2.5: composer-2.5-fast
  composer-fast: composer-2.5-fast
  gemini-flash: gemini-3-flash
  grok: cursor-grok-4.5-high-fast
  gpt-5.5: gpt-5.5-medium
  gpt-5.6: gpt-5.6-sol-medium
